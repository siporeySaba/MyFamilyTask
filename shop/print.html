<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחירון חנות ההפתעות</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; }
  body {
    background: #e9e4f5;
    font-family: 'Varela Round', 'Heebo', sans-serif;
    color: #3b2a55;
  }
  .toolbar {
    text-align: center; padding: 16px;
    font-family: 'Secular One', sans-serif;
  }
  .toolbar button {
    font: inherit; font-size: 1.2rem; cursor: pointer;
    background: #7b3fe4; color: #fff; border: 0; border-radius: 16px;
    padding: 10px 26px; box-shadow: 0 5px 0 #5a28b5;
  }
  .toolbar p { margin: 8px 0 0; color: #6b5b85; font-family: 'Varela Round', sans-serif; font-size: .95rem; }

  .page {
    width: 210mm; height: 297mm;
    margin: 0 auto 24px;
    position: relative; overflow: hidden;
    padding: 12mm 11mm 10mm;
    background:
      radial-gradient(circle at 8% 6%, #ffd6e8 0 9mm, transparent 9.2mm),
      radial-gradient(circle at 94% 12%, #d4f5e4 0 12mm, transparent 12.2mm),
      radial-gradient(circle at 4% 92%, #fff1c2 0 14mm, transparent 14.2mm),
      radial-gradient(circle at 97% 96%, #dbe8ff 0 11mm, transparent 11.2mm),
      radial-gradient(#f0e6ff 1.1px, transparent 1.3px) 0 0 / 7mm 7mm,
      #fffdf8;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(60, 30, 110, .18);
  }
  .confetti { position: absolute; font-size: 7mm; opacity: .9; }

  header { text-align: center; position: relative; }
  .awning {
    height: 11mm; margin: 0 -11mm 4mm;
    background: repeating-linear-gradient(90deg, #ff6fb5 0 14mm, #fff 14mm 28mm);
    -webkit-mask: radial-gradient(7mm 5mm at 50% 100%, transparent 98%, #000) 0 0 / 14mm 100% repeat-x;
            mask: radial-gradient(7mm 5mm at 50% 100%, transparent 98%, #000) 0 0 / 14mm 100% repeat-x;
    position: absolute; top: -12mm; left: 0; right: 0;
  }
  h1 {
    font-family: 'Secular One', sans-serif;
    font-size: 17mm; line-height: 1; margin: 6mm 0 1mm;
    color: #7b3fe4;
    text-shadow: 1.2mm 1.2mm 0 #ffd23f;
    letter-spacing: .3mm;
  }
  .sub { font-size: 5.4mm; margin: 0; color: #5a4a75; }
  .sub b { color: #e8458b; }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    min-height: 0;
    gap: 3.6mm;
    margin: 6mm 0 4mm;
  }
  .item {
    background: #fff;
    border: .8mm solid var(--c);
    border-radius: 6mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2mm; padding: 2mm 1.5mm;
    position: relative;
    box-shadow: 0 1.4mm 0 var(--c);
    transform: rotate(var(--r));
  }
  .item.big { grid-column: 1 / -1; flex-direction: row; gap: 5mm; background: linear-gradient(90deg, #fff, var(--soft)); }
  .item.big .em { font-size: 14mm; width: 22mm; height: 22mm; }
  .item.big .nm { font-size: 7mm; }
  .item.big .pr { font-size: 6mm; padding: .6mm 5mm; }
  .item.big .tag { font-family: 'Secular One', sans-serif; font-size: 4.2mm; color: var(--c); }
  .item .em {
    font-size: 11mm; line-height: 1;
    width: 18mm; height: 18mm; border-radius: 50%;
    background: var(--soft);
    display: grid; place-items: center;
  }
  .item .nm { font-family: 'Secular One', sans-serif; font-size: 4.3mm; text-align: center; line-height: 1.15; }
  .item .pr {
    background: var(--c); color: #fff;
    font-family: 'Secular One', sans-serif; font-size: 4.6mm;
    border-radius: 99px; padding: .4mm 3.5mm;
    display: inline-flex; align-items: center; gap: 1mm;
  }
  .item .pr small { font-size: 3mm; opacity: .9; }

  .how {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm;
    background: #f3ebff; border: .6mm dashed #b892ff; border-radius: 6mm;
    padding: 3mm 4mm;
  }
  .how div { display: flex; align-items: center; gap: 2.5mm; font-size: 3.9mm; line-height: 1.25; }
  .how .n {
    flex: none; width: 8mm; height: 8mm; border-radius: 50%;
    background: #7b3fe4; color: #fff; display: grid; place-items: center;
    font-family: 'Secular One', sans-serif; font-size: 4.4mm;
  }
  footer { text-align: center; font-size: 3.2mm; color: #9a8ab3; margin-top: 2.5mm; }

  @media print {
    body { background: none; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; }
  }
  @media screen and (max-width: 820px) {
    .page { zoom: calc(100vw / 220mm); }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="print()">🖨️ הדפסה</button>
    <p>מומלץ להדפיס בצבע, על דף A4, בלי שוליים (בהגדרות ההדפסה: "שוליים – ללא").</p>
  </div>

  <div class="page">
    <span class="confetti" style="top:22mm;right:16mm;transform:rotate(-15deg)">⭐</span>
    <span class="confetti" style="top:26mm;left:18mm;transform:rotate(12deg)">🎈</span>
    <span class="confetti" style="top:44mm;right:42mm;font-size:5mm">✨</span>
    <span class="confetti" style="top:44mm;left:44mm;font-size:5mm">🎉</span>
    <header>
      <div class="awning"></div>
      <h1>🎁 חנות ההפתעות</h1>
      <p class="sub">קונים <b>בנקודות</b> שצוברים במשימות!</p>
    </header>

    <main class="grid" id="grid"></main>

    <section class="how">
      <div><span class="n">1</span>עושים משימות ואוספים נקודות ⭐</div>
      <div><span class="n">2</span>בוחרים הפתעה בחנות שבאפליקציה 🛍️</div>
      <div><span class="n">3</span>אבא או אמא מביאים לכם אותה 🥳</div>
    </section>
    <footer>הנקודות של היום נכנסות ליתרה למחרת · חוסכים? אפשר לקנות משהו גדול יותר!</footer>
  </div>

<script type="module">
  import { SHOP_ITEMS } from '../js/shopCatalog.js';
  // צבע לכל דרגת מחיר
  const tiers = [
    { max: 100, c: '#a66cff', soft: '#f1e8ff' },
    { max: 130, c: '#3fa7f5', soft: '#e3f3ff' },
    { max: 170, c: '#2fbf71', soft: '#e0f7ea' },
    { max: 220, c: '#ff8a3d', soft: '#fff0e3' },
    { max: Infinity, c: '#f0458b', soft: '#ffe6f0' },
  ];
  const tilt = [-1.2, .8, -.5, 1.1, .4, -.9, 1.3, -.3];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const items = [...SHOP_ITEMS].sort((a, b) => a.cost - b.cost);
  document.getElementById('grid').innerHTML = items.map((it, i) => {
    const t = tiers.find(t => it.cost <= t.max);
    const big = it.cost >= 250;
    return `<div class="item${big ? ' big' : ''}" style="--c:${t.c};--soft:${t.soft};--r:${tilt[i % tilt.length]}deg">
      <div class="em">${it.emoji}</div>
      ${big ? `<div><div class="tag">⭐ ההפתעה הגדולה – שווה לחסוך!</div><div class="nm">${esc(it.name)}</div></div>` : `<div class="nm">${esc(it.name)}</div>`}
      <div class="pr">🪙 ${it.cost} <small>נק׳</small></div>
    </div>`;
  }).join('');
</script>
</body>
</html>
